<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Greatest Me</title>
    <meta name="apple-mobile-web-app-title" content="Greatest Me">
    <meta name="application-name" content="Greatest Me">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=gm-20260616">
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="./apple-touch-icon.png?v=gm-20260616">
    <link rel="icon" type="image/png" href="./favicon.png?v=gm-20260616">
    <link rel="manifest" href="./site.webmanifest?v=gm-20260616">
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #fffdfc;
        color: #2f2933;
      }

      main {
        width: min(320px, calc(100vw - 48px));
        text-align: center;
      }

      img {
        width: 112px;
        height: 112px;
        border-radius: 24px;
        display: block;
        margin: 0 auto 18px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1;
        font-weight: 700;
      }

      p {
        margin: 0 0 18px;
        color: #756a78;
        font-size: 15px;
        line-height: 1.35;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 20px;
        border-radius: 999px;
        background: #ff9bad;
        color: white;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./apple-touch-icon.png?v=gm-20260616" alt="">
      <h1>Greatest Me</h1>
      <p>Add this page to your Home Screen. When you open it from the icon, it will take you to the app.</p>
      <a href="/">Open app</a>
    </main>
    <script>
      if (window.navigator.standalone || window.matchMedia("(display-mode: standalone)").matches) {
        window.location.replace("/");
      }
    </script>
  </body>
</html>
